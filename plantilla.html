<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nacho quick</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #363232;
            margin: 0;
            padding: 0;
            color: #060606;
        }

        header {
            background-color: #1f505a;
            padding: 20px;
            color: rgb(0, 0, 0);
            font-size: 24px;
            font-weight: bold;
        }

        .layout {
            display: flex;
        }

        nav {
            background-color: #1e2223;
            width: 200px;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 14px;
        }

        nav a:hover {
            background-color: #1b5e5c;
        }

        .contenedor {
            flex: 1;
            padding: 30px;
        }

        .card {
            background-color: white;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            padding: 25px;
            max-width: 750px;
        }

        .card h2 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #c8e6c9;
            padding-bottom: 8px;
        }

        .card p {
            padding: 8px 0;
            border-bottom: 1px solid #e8f5e9;
            font-size: 0.95rem;
        }

        .card p:last-child {
            border-bottom: none;
        }

        form p {
            margin-bottom: 12px;
            border-bottom: none;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form select {
            display: block;
            margin-top: 4px;
            padding: 7px 10px;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
            width: 300px;
        }

        form button[type="submit"] {
            padding: 8px 22px;
            background-color: #2e4f7d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        form button[type="submit"]:hover {
            background-color: #00daa075;
        }
    </style>
</head>
<body>

    <header>GIMNASIO "El nacho"</header>

    <div class="layout">
        <nav>
            <a href="/">Inicio</a>
            <a href="/clientes">Alumnos</a>
            <a href="/profesores">Profesores</a>
            <a href="/registroclientes">Registrar Alumno</a>
            <a href="/registroprofe">Registrar Profesor</a>
        </nav>

        <div class="contenedor">
            {contenido}
        </div>
    </div>

</body>
</html>
