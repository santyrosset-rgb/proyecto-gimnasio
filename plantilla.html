<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>Nacho quick</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f6fcfb;
            margin: 0;
            padding: 0;
            color: #1f4a45;
        }

        header {
            background: linear-gradient(90deg, #8fdcd1, #c4f1ea);
            padding: 20px;
            color: #0b4f48;
            font-size: 24px;
            font-weight: bold;
        }

        .layout {
            display: flex;
        }

        nav {
            background-color: #e6f6f3;
            width: 200px;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        nav a {
            color: #1b6b62;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 14px;
        }

        nav a:hover {
            background-color: #a8e6dd;
            color: #0b4f48;
        }

        .contenedor {
            flex: 1;
            padding: 30px;
        }

        .card {
            background-color: white;
            border: 1px solid #d2eeea;
            border-radius: 6px;
            padding: 25px;
            max-width: 750px;
        }

        .card h2 {
            color: #1f9a8d;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #8fdcd1;
            padding-bottom: 8px;
        }

        .card p {
            padding: 8px 0;
            font-size: 0.95rem;
        }

        form p {
            margin-bottom: 12px;
            border-bottom: none;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form select {
            display: block;
            margin-top: 4px;
            padding: 7px 10px;
            border: 1px solid #bfe5de;
            border-radius: 4px;
            font-size: 14px;
            width: 300px;
        }

        form button[type="submit"] {
            padding: 8px 22px;
            background: linear-gradient(90deg, #6fd3c6, #9be3da);
            color: #0b4f48;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        form button[type="submit"]:hover {
            background: #5cc7b9;
        }
    </style>
</head>
<body>

    <header>GIMNASIO "El nacho"</header>

    <div class="layout">
        <nav>
            <a href="/">Inicio</a>
            <a href="/clientes">Alumnos</a>
            <a href="/profesores">Profesores</a>
            <a href="/registroclientes">Registrar Alumno</a>
            <a href="/registroprofe">Registrar Profesor</a>
            <a href="/maquinaria">Maquinaria</a>
        </nav>

        <div class="contenedor">
            {contenido}
        </div>
    </div>

</body>
</html>
